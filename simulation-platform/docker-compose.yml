#
# MARC 2026 - participant tools run (profiles: platform / dataset-gen / manip-trainer)
# ===========================================================================
# All three tools share ONE unified image (marc-platform:practice); the profile picks which entry runs.
# This is a Dockerfile-only distribution, so images are not pulled - they are built locally from context.
# Build context = starter-kit repo root (this compose lives under simulation-platform/, hence context: ..).
#
# Run (from repo root or anywhere via -f):
#   docker compose -f simulation-platform/docker-compose.yml --profile platform     up --build   # simulation platform
#   docker compose -f simulation-platform/docker-compose.yml --profile dataset-gen  up --build   # CCTV dataset generator
#   docker compose -f simulation-platform/docker-compose.yml --profile ego-dataset-gen up --build # robot-base-cam YOLO set
#   docker compose -f simulation-platform/docker-compose.yml --profile manip-trainer up --build  # manipulation trainer
#   docker compose -f simulation-platform/docker-compose.yml --profile platform down             # stop
# Convenience wrapper: bash simulation-platform/marc.sh platform | dataset-gen | ego-dataset-gen | manip-trainer | down
#
# Change scenario/headless: .env (copy .env.example) or prefix env
#   ENV_MARC_SCENARIO=marc2026_chungmu HEADLESS=false docker compose ... up
#   Public practice scenarios: marc2026_chungmu (full self-scoring set) | marc2026_demo (baseline walkthrough).
# Pick which problems are posed: edit ./problems.yaml (or `marc.sh select <scenario>`). It is used
#   automatically when present (no env var needed); delete it to pose all problems.
# ===========================================================================

x-marc-common: &marc-common
  runtime: nvidia
  network_mode: "host"                 # single-participant setup (sequential scoring)
  environment: &marc-env
    ACCEPT_EULA: "Y"                   # NVIDIA EULA acceptance (participant is the licensee)
    PRIVACY_CONSENT: "Y"
    ENV_MARC_SCENARIO: "${ENV_MARC_SCENARIO:-marc2026_chungmu}"
    HEADLESS: "${HEADLESS:-false}"
    # GUI (HEADLESS=false): preserve the SSH-forwarded display. marc.sh rejects an
    # empty value before launch instead of silently sending Isaac to a nonexistent :0.
    DISPLAY: "${DISPLAY:-}"
    XAUTHORITY: "/root/.Xauthority"
    ISAAC_SIM_PATH: "/isaac-sim"
    RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"
    AMENT_PREFIX_PATH: "/isaac-sim/exts/isaacsim.ros2.bridge/humble"
    LD_LIBRARY_PATH: "/isaac-sim/exts/isaacsim.ros2.bridge/humble/lib:${LD_LIBRARY_PATH:-}"
    PYTHONPATH: "/isaac-sim/exts/isaacsim.ros2.bridge/humble/rclpy:/metacom2026/simulation_app/marc2026"
    USD_PLUGIN_PATH: "/isaac-sim/exts/isaacsim.robot.schema/plugins"
    ROS_DISTRO: "humble"
    FASTRTPS_DEFAULT_PROFILES_FILE: "/metacom2026/simulation_app/config/fastdds.xml"  # UDP-only (avoids SHM)
    ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
    # Your assigned team ID. Used by the manipulation trainer as the robot ROS2 topic
    # namespace (/marc/<team>/robot/...), so it must match MARC_TEAM_ID in your app.
    MARC_TEAM_ID: "${MARC_TEAM_ID:-u1}"
    NVIDIA_VISIBLE_DEVICES: "all"
    NVIDIA_DRIVER_CAPABILITIES: "all"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  platform:                            # <- marc.sh platform / make platform
    <<: *marc-common
    profiles: ["platform"]
    build:
      context: ..                      # starter-kit repo root = build context
      dockerfile: simulation-platform/Dockerfile.practice
      args:
        CONTENT_IMAGE: "${MARC_CONTENT_IMAGE:-ghcr.io/marc-challenge/marc-platform-content:2026.R03}"
    image: marc-platform:practice      # local build output (do not redistribute)
    environment:
      <<: *marc-env
      # Auto-start without admin (participant: check via GUI score panel/viewport). all|first|"<id>,<id>"
      MARC_AUTO_START: "${MARC_AUTO_START:-1}"
      MARC_AUTO_STAGE1: "${MARC_AUTO_STAGE1:-all}"
      MARC_AUTO_STAGE2: "${MARC_AUTO_STAGE2:-auto}"
      # Problem selection is automatic: the mounted problems.yaml is used when present (pose only
      # its enabled items). No env var needed. MARC_AUTO_STAGE1/STAGE2 above apply only when the
      # file is absent/invalid. Optional: MARC_PROBLEM_SELECTION overrides the file path.
      MARC_PROBLEM_SELECTION: "${MARC_PROBLEM_SELECTION:-}"
      # Diagnostics: arm cmd-vs-actual joint angles + EE/target distance (ARMCAL/TUMCAL logs).
      MARC_ARM_DEBUG: "${MARC_ARM_DEBUG:-0}"
    # The participant image has no separate web console, and network_mode: host exposes any port
    # directly, so no ports: mapping is needed.
    # Boot wrapper: applies the asset patches under ./patches, then execs the entry below.
    command: ["/marc-patches/boot.py", "/metacom2026/simulation_app/marc2026/runtime.py"]
    volumes:
      - ./patches:/marc-patches:ro
      - ../results:/metacom2026/results:rw
      # Problem-selection file (assembled from problems.yaml.example). Edit on the host; read-only in the container.
      - ../problems.yaml:/metacom2026/problems.yaml:ro
      - ../.runtime-data/cache/kit:/isaac-sim/kit/cache:rw
      - ../.runtime-data/cache/ov:/root/.cache/ov:rw
      - ../.runtime-data/cache/pip:/root/.cache/pip:rw
      - ../.runtime-data/cache/glcache:/root/.cache/nvidia/GLCache:rw
      - ../.runtime-data/cache/computecache:/root/.nv/ComputeCache:rw
      - ../.runtime-data/logs:/root/.nvidia-omniverse/logs:rw
      - ../.runtime-data/data:/root/.local/share/ov/data:rw
      # SSH X11 uses the per-login cookie; no broad xhost permission is needed.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:ro

  dataset-gen: &dataset-gen            # <- marc.sh dataset-gen  (perception labels; entry = trainer.py)
    <<: *marc-common
    profiles: ["dataset-gen"]
    build:
      context: ..
      # Same unified image as the platform.
      dockerfile: simulation-platform/Dockerfile.practice
      args:
        CONTENT_IMAGE: "${MARC_CONTENT_IMAGE:-ghcr.io/marc-challenge/marc-platform-content:2026.R03}"
    image: marc-platform:practice
    environment: &dataset-env
      <<: *marc-env
      # N>0 generates N scenes without the GUI and exits (batch dataset generation).
      # 0 (default) keeps the interactive panel: New Scene / New Camera.
      # Stock trainer caps each run at 200; boot patch honors N (optional
      # TRAINER_AUTO_SCENES_MAX restores a ceiling, e.g. 200).
      TRAINER_AUTO_SCENES: "${TRAINER_AUTO_SCENES:-0}"
      TRAINER_AUTO_SCENES_MAX: "${TRAINER_AUTO_SCENES_MAX:-0}"
      # Lost-object copies per selected class (default 4-6). People unchanged.
      TRAINER_MIN_INSTANCES: "${TRAINER_MIN_INSTANCES:-4}"
      TRAINER_MAX_INSTANCES: "${TRAINER_MAX_INSTANCES:-6}"
      # Landmark copies per kept type. Lower than objects so benches/tables do not
      # bury small targets. Set both to 1 for the stock one-instance catalogue.
      TRAINER_LANDMARK_MIN_INSTANCES: "${TRAINER_LANDMARK_MIN_INSTANCES:-1}"
      TRAINER_LANDMARK_MAX_INSTANCES: "${TRAINER_LANDMARK_MAX_INSTANCES:-2}"
      # Probability each checked non-vehicle landmark type is kept this scene.
      # 0.35 = subset per frame (Qwen referring expressions); 1 = every type.
      TRAINER_CLASS_INCLUSION_PROBABILITY: "${TRAINER_CLASS_INCLUSION_PROBABILITY:-0.35}"
      # Cars / SUVs / taxis: at most one type, one copy, rarely included.
      TRAINER_VEHICLE_MIN_INSTANCES: "${TRAINER_VEHICLE_MIN_INSTANCES:-1}"
      TRAINER_VEHICLE_MAX_INSTANCES: "${TRAINER_VEHICLE_MAX_INSTANCES:-1}"
      TRAINER_VEHICLE_INCLUSION_PROBABILITY: "${TRAINER_VEHICLE_INCLUSION_PROBABILITY:-0.15}"
      TRAINER_VEHICLE_MAX_TYPES: "${TRAINER_VEHICLE_MAX_TYPES:-1}"
      # Lost objects never spawned. Organizer exclusions: long_umbrella,
      # master_chef_can, wood_block. closedlongumbrella is the same long mesh.
      # Ordinary umbrella is trained.
      TRAINER_SKIP_CLASSES: "${TRAINER_SKIP_CLASSES:-long_umbrella,master_chef_can,wood_block}"
      # 1 = one of each person identity per scene (female/professor/weight/male),
      # random pose. 0 = stock radio (one character x all poses).
      TRAINER_PEOPLE_ALL_CHARS: "${TRAINER_PEOPLE_ALL_CHARS:-1}"
      TRAINER_SAR_RECIPES: "${TRAINER_SAR_RECIPES:-0}"
      # 1 = ordinary CCTV for YOLO26x (no SAR climb seating; inject catalog
      # extras the GUI left unchecked; force-spawn umbrella if the GUI omitted it).
      # Wins over TRAINER_SAR_RECIPES and TRAINER_PEOPLE_ABOVE.
      TRAINER_YOLO_MODE: "${TRAINER_YOLO_MODE:-0}"
      TRAINER_YOLO_FORCE_CLASSES: "${TRAINER_YOLO_FORCE_CLASSES:-umbrella}"
      # Empty = continue from max scene_* + 1. Set to an int to pin the cycle.
      TRAINER_SAR_RECIPE_CURSOR: "${TRAINER_SAR_RECIPE_CURSOR:-}"
      # Seat a fraction of people on landmark tops (vending machine, trash can,
      # bench, picnic table). Needed for SAR "climbed on the drink machine".
      TRAINER_PEOPLE_ON_LANDMARK_PROB: "${TRAINER_PEOPLE_ON_LANDMARK_PROB:-0.45}"
      TRAINER_PEOPLE_WRONG_PLACE_PROB: "${TRAINER_PEOPLE_WRONG_PLACE_PROB:-0.55}"
      TRAINER_FORCE_CLIMB_LANDMARK_PROB: "${TRAINER_FORCE_CLIMB_LANDMARK_PROB:-0.35}"
      # 1 = construct every scene with one random-pose climber on a guaranteed
      # climb landmark. Extra people stay on the ground.
      TRAINER_PEOPLE_ABOVE: "${TRAINER_PEOPLE_ABOVE:-0}"
      TRAINER_PEOPLE_ABOVE_CLEARANCE: "${TRAINER_PEOPLE_ABOVE_CLEARANCE:-0.03}"
      TRAINER_PEOPLE_ABOVE_TYPES: "${TRAINER_PEOPLE_ABOVE_TYPES:-vending_machine,trash_can,hydrant,postbox}"
      # Repeat counts in the climb-target cycle. Empty = even cycle.
      TRAINER_PEOPLE_ABOVE_WEIGHTS: "${TRAINER_PEOPLE_ABOVE_WEIGHTS:-}"
      # Optional comma lists. Empty = full catalog. Short names work
      # (weight, sitting). Pins climber + extras to those meshes/poses.
      TRAINER_PEOPLE_CHARS: "${TRAINER_PEOPLE_CHARS:-}"
      TRAINER_PEOPLE_POSES: "${TRAINER_PEOPLE_POSES:-}"
      # Unused (forced off). Mesh-vert snap launched climbers into the sky.
      TRAINER_PEOPLE_VEND_MESH_CONTACT: "${TRAINER_PEOPLE_VEND_MESH_CONTACT:-0}"
      # Female/professor vending sit: auto = mix of glass-center and corners.
      # Pin with center|left|right. Always clamped onto the cabinet roof.
      TRAINER_PEOPLE_VEND_SLOT: "${TRAINER_PEOPLE_VEND_SLOT:-auto}"
      # Render fresh frames after redeploy/contact before GT capture, clearing
      # RTX temporal after-images from the previous scene.
      TRAINER_RENDER_WARMUP_FRAMES: "${TRAINER_RENDER_WARMUP_FRAMES:-12}"
    # Boot wrapper (same asset patches as the platform), then the dataset generator entry.
    command: ["/marc-patches/boot.py", "/metacom2026/simulation_app/marc2026/trainer.py"]
    volumes:
      - ./patches:/marc-patches:ro
      - ../trainer_output:/metacom2026/trainer_output:rw
      - ../.runtime-data/cache/kit:/isaac-sim/kit/cache:rw
      - ../.runtime-data/cache/ov:/root/.cache/ov:rw
      - ../.runtime-data/cache/pip:/root/.cache/pip:rw
      - ../.runtime-data/cache/glcache:/root/.cache/nvidia/GLCache:rw
      - ../.runtime-data/cache/computecache:/root/.nv/ComputeCache:rw
      - ../.runtime-data/logs:/root/.nvidia-omniverse/logs:rw
      - ../.runtime-data/data:/root/.local/share/ov/data:rw
      # GUI (HEADLESS=false, the default): the generator needs a reachable X display.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:ro

  # One-shot balanced Qwen3-VL LoRA corpus: isolated GT -> runtime-shaped JSONL.
  # It cycles every SAR archetype while random object/landmark/camera placement
  # supplies identity, relation, same-class, occlusion, and viewpoint examples.
  qwen-dataset-gen:
    <<: *dataset-gen
    profiles: ["qwen-dataset-gen"]
    environment:
      <<: *dataset-env
      HEADLESS: "true"
      TRAINER_AUTO_SCENES: "${QWEN_DATASET_SCENES:-420}"
      TRAINER_AUTO_SCENES_MAX: "0"
      TRAINER_MIN_INSTANCES: "3"
      TRAINER_MAX_INSTANCES: "5"
      TRAINER_CLASS_INCLUSION_PROBABILITY: "0.50"
      TRAINER_VEHICLE_INCLUSION_PROBABILITY: "0.35"
      TRAINER_VEHICLE_MAX_TYPES: "2"
      TRAINER_PEOPLE_ALL_CHARS: "1"
      TRAINER_SAR_RECIPES: "1"
      TRAINER_YOLO_MODE: "0"
      TRAINER_PEOPLE_ABOVE: "0"
      TRAINER_SAR_RECIPE_CURSOR: "${QWEN_DATASET_RECIPE_CURSOR:-}"
    command: ["/marc-patches/run_qwen_dataset_gen.py"]
    volumes:
      - ./patches:/marc-patches:ro
      - ..:/marc-agent-repo:ro
      - ${QWEN_GT_DIR:-../trainer_output/qwen3vl_gt}:/metacom2026/trainer_output:rw
      - ${QWEN_LORA_DIR:-../trainer_output/qwen3vl_lora}:/qwen-output:rw
      - ../.runtime-data/cache/kit:/isaac-sim/kit/cache:rw
      - ../.runtime-data/cache/ov:/root/.cache/ov:rw
      - ../.runtime-data/cache/pip:/root/.cache/pip:rw
      - ../.runtime-data/cache/glcache:/root/.cache/nvidia/GLCache:rw
      - ../.runtime-data/cache/computecache:/root/.nv/ComputeCache:rw
      - ../.runtime-data/logs:/root/.nvidia-omniverse/logs:rw
      - ../.runtime-data/data:/root/.local/share/ov/data:rw

  # Manipulation trainer - same unified image, only the entry differs via command.
  #   A practice tool, so it is not part of the competition scoring runtime.
  manip-trainer:                       # <- marc.sh manip-trainer  (entry = manipulation_trainer.py)
    <<: *marc-common
    profiles: ["manip-trainer"]
    build:
      context: ..
      dockerfile: simulation-platform/Dockerfile.practice
      args:
        CONTENT_IMAGE: "${MARC_CONTENT_IMAGE:-ghcr.io/marc-challenge/marc-platform-content:2026.R03}"
    image: marc-platform:practice
    # Boot wrapper (same asset patches as the platform), then the manipulation trainer entry.
    command: ["/marc-patches/boot.py", "/metacom2026/simulation_app/marc2026/manipulation_trainer.py"]
    volumes:
      - ./patches:/marc-patches:ro
      - ../trainer_output:/metacom2026/trainer_output:rw
      - ../.runtime-data/cache/kit:/isaac-sim/kit/cache:rw
      - ../.runtime-data/cache/ov:/root/.cache/ov:rw
      - ../.runtime-data/cache/pip:/root/.cache/pip:rw
      - ../.runtime-data/cache/glcache:/root/.cache/nvidia/GLCache:rw
      - ../.runtime-data/cache/computecache:/root/.nv/ComputeCache:rw
      - ../.runtime-data/logs:/root/.nvidia-omniverse/logs:rw
      - ../.runtime-data/data:/root/.local/share/ov/data:rw
      # GUI (HEADLESS=false): view the trainer viewport for pnp_tune.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:ro

  # Robot-base-camera YOLO dataset. Same image as manip-trainer; entry is a bind-mounted
  # generator that attaches Replicator GT to Base_Camera_Left (640x480) and writes
  # Ultralytics labels under trainer_output/ego_yolo. Do not mix with CCTV dataset-gen
  # when fine-tuning the approach detector.
  ego-dataset-gen:                     # <- marc.sh ego-dataset-gen
    <<: *marc-common
    profiles: ["ego-dataset-gen"]
    build:
      context: ..
      dockerfile: simulation-platform/Dockerfile.practice
      args:
        CONTENT_IMAGE: "${MARC_CONTENT_IMAGE:-ghcr.io/marc-challenge/marc-platform-content:2026.R03}"
    image: marc-platform:practice
    environment:
      <<: *marc-env
      # Batch capture does not need a viewport. Override with EGO_HEADLESS=false to watch.
      HEADLESS: "${EGO_HEADLESS:-true}"
      EGO_SCENES: "${EGO_SCENES:-200}"
      EGO_SEED: "${EGO_SEED:-0}"
      EGO_OBJECTS_MIN: "${EGO_OBJECTS_MIN:-1}"
      EGO_OBJECTS_MAX: "${EGO_OBJECTS_MAX:-3}"
      EGO_REACH_MIN: "${EGO_REACH_MIN:-0.5}"
      EGO_REACH_MAX: "${EGO_REACH_MAX:-3.5}"
      EGO_LAT: "${EGO_LAT:-2.5}"
      EGO_BEARING_DEG: "${EGO_BEARING_DEG:-50}"
      EGO_ROBOT_XY: "${EGO_ROBOT_XY:-4}"
      EGO_YAW_SPAN: "${EGO_YAW_SPAN:-360}"
      EGO_SKIP_CLASSES: "${EGO_SKIP_CLASSES:-long_umbrella,master_chef_can,wood_block}"
      EGO_FORCE_CLASSES: "${EGO_FORCE_CLASSES:-umbrella}"
      EGO_FORCE_FRAC: "${EGO_FORCE_FRAC:-0.85}"
      EGO_EMPTY_FRAC: "${EGO_EMPTY_FRAC:-0}"
      EGO_VAL_FRAC: "${EGO_VAL_FRAC:-0.2}"
      # Always ego_yolo. The generator refuses trainer_output/marc2026_* CCTV dumps.
      EGO_OUT: "${EGO_OUT:-/metacom2026/trainer_output/ego_yolo}"
      EGO_SAVE_OVERLAY: "${EGO_SAVE_OVERLAY:-1}"
    command: ["/marc-patches/boot.py", "/marc-patches/ego_dataset_gen.py"]
    volumes:
      - ./patches:/marc-patches:ro
      - ../trainer_output:/metacom2026/trainer_output:rw
      - ../.runtime-data/cache/kit:/isaac-sim/kit/cache:rw
      - ../.runtime-data/cache/ov:/root/.cache/ov:rw
      - ../.runtime-data/cache/pip:/root/.cache/pip:rw
      - ../.runtime-data/cache/glcache:/root/.cache/nvidia/GLCache:rw
      - ../.runtime-data/cache/computecache:/root/.nv/ComputeCache:rw
      - ../.runtime-data/logs:/root/.nvidia-omniverse/logs:rw
      - ../.runtime-data/data:/root/.local/share/ov/data:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:ro

  select:                              # <- marc.sh select  (problem-selection TUI, in-container)
    # Reuses the platform image and reads the scenario from inside it (/metacom2026/scenarios), so no
    # scenario file is exposed in this repository. Writes the picked problems to the host ./problems.yaml.
    profiles: ["select"]
    image: marc-platform:practice
    stdin_open: true                   # interactive TTY for the curses checklist
    tty: true
    environment:
      MARC_SCENARIOS_DIR: /metacom2026/scenarios
    entrypoint: ["python3", "/metacom2026/simulation_app/marc2026/tools/select_problems.py"]
    volumes:
      - ../problems.yaml:/metacom2026/problems.yaml:rw   # TUI saves the selection here (host copy)
