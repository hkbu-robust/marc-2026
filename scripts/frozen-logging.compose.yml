# Run the frozen qualifier pair with the #85 logging build of the agent, or
# any agent image built the same way (MARC_AGENT_IMAGE, set by run_stage1_repeats).
#   docker compose -f docker-compose.yml -f docker-compose.frozen.yml \
#     -f scripts/frozen-logging.compose.yml up
# Experiment runs can share one GPU (scripts/README.md, "Sharing the GPU"):
# MARC_VLLM_PORT moves vLLM off 8004, MARC_VLLM_MEMORY_MIBS sizes it as if the
# card had that much memory (49152 = the 48 GB judging card, ~36 GB reserved).
services:
  qwen:
    image: ${MARC_QWEN_IMAGE:-marc-qwen-vllm:qualifier-b2360c86}
    environment:
      VLLM_PORT: "${MARC_VLLM_PORT:-8004}"
      VLLM_GPU_MEMORY_MIBS: "${MARC_VLLM_MEMORY_MIBS:-}"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:' + os.environ['VLLM_PORT'] + '/v1/models', headers={'Authorization': 'Bearer ' + os.environ['VLLM_API_KEY']}); urllib.request.urlopen(request, timeout=5)"
  agent:
    image: ${MARC_AGENT_IMAGE:-marc-agent:frozen-logging}
    environment:
      MARC_QWEN_BASE_URL: "http://127.0.0.1:${MARC_VLLM_PORT:-8004}/v1"
      MARC_ROUND_DUMP: "${MARC_ROUND_DUMP:-1}"
