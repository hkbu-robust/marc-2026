# #90 configuration 2, "base Qwen": the deployed system with the original
# Qwen/Qwen3-VL-8B-Instruct (no LoRA) served in place of the fine-tuned model.
# Same vLLM image, flags, served name and prompts; only the weights differ.
# Use with run_stage1_repeats --extra-compose scripts/compose/e2e-config-2-base-qwen.yml
services:
  qwen:
    environment:
      MARC_BUILD_MODE: development
      VLLM_MODEL_DIR: /models-dev/qwen
    volumes:
      - ${MARC_BASE_QWEN_DIR:?Set MARC_BASE_QWEN_DIR to local Qwen3-VL-8B-Instruct snapshot directory}:/models-dev/qwen:ro
