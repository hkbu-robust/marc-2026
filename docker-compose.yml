# MARC 2026 submission entry point: a fresh clone needs only `docker compose up`.
services:
  qwen:
    build:
      context: .
      dockerfile: demo/Dockerfile.vllm
      network: host
      entitlements:
        - network.host
      args:
        MARC_BUILD_MODE: "${MARC_BUILD_MODE:-baked}"
    # Team-specific name, always built from this checkout: a judging machine may still
    # hold another build under the starter kit's default `:local` names.
    image: robust-qwen:finals
    pull_policy: build
    network_mode: host
    runtime: nvidia
    ipc: host
    environment:
      MARC_BUILD_MODE: "${MARC_BUILD_MODE:-baked}"
      VLLM_API_KEY: "marc-qwen-secret"
      VLLM_MODEL_NAME: "qwen3-vl-8b"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8004/v1/models', headers={'Authorization': 'Bearer ' + os.environ['VLLM_API_KEY']}); urllib.request.urlopen(request, timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 60
      start_period: 5m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  agent:
    restart: on-failure
    depends_on:
      qwen:
        condition: service_healthy
    build:
      context: .
      dockerfile: demo/Dockerfile
      target: agent
      network: host
      entitlements:
        - network.host
      args:
        MARC_BUILD_MODE: "${MARC_BUILD_MODE:-baked}"
        MARC_QWEN_BACKEND: remote
    image: robust-agent:finals
    pull_policy: build
    network_mode: host
    runtime: nvidia
    environment:
      MARC_TEAM_ID: "${MARC_TEAM_ID:-robust}"
      MARC_TOKEN: "${MARC_TOKEN:-PASTE_YOUR_TOKEN_HERE}"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"
      PYTHONPATH: "/agent:/agent/demo"
      PYTHONUNBUFFERED: "1"
      MARC_EXPERIMENTS_DIR: "/agent/experiments"
      MARC_RUN_MODE: "submission"
      MARC_SAR_DETECTOR: "qwen-remote"
      MARC_QWEN_BACKEND: "remote"
      MARC_QWEN_BASE_URL: "http://127.0.0.1:8004/v1"
      MARC_QWEN_API_KEY: "marc-qwen-secret"
      MARC_QWEN_MODEL: "qwen3-vl-8b"
      MARC_QWEN_WALL_TIMEOUT_S: "${MARC_QWEN_WALL_TIMEOUT_S:-90}"
      MARC_QWEN_MAX_CROPS: "${MARC_QWEN_MAX_CROPS:-12}"
      MARC_CCTV_DISCOVERY_TIMEOUT_S: "${MARC_CCTV_DISCOVERY_TIMEOUT_S:-10}"
      MARC_STAGE1_SCENE_CACHE: "${MARC_STAGE1_SCENE_CACHE:-0}"
      MARC_GRASPGENX_WEIGHTS: "/agent/models/runtime/graspgenx"
      GRASPGENX_CHECKPOINT_DIR: "/agent/models/runtime/graspgenx"
      GRASPGENX_GRIPPER_CFG_DIR: "/agent/models/runtime/graspgenx/grippers"
      MARC_GRASPGENX_GRIPPER: "${MARC_GRASPGENX_GRIPPER:-robotiq_2f_140}"
      MARC_YOLO_WEIGHTS: "/agent/models/runtime/stage2-nearfield-detector/model.pt"
      MARC_PICK_POLICY: "${MARC_PICK_POLICY:-graspgenx}"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      YOLO_OFFLINE: "1"
    volumes:
      - "${MARC_EXPERIMENTS_HOST_DIR:-./experiments}:/agent/experiments"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
