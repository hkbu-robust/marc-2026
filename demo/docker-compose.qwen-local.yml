# Practice override: load Qwen inside the participant container from a host snapshot.
# Usage:
#   MARC_QWEN_HOST_MODEL_DIR=~/marc-2026-work/pretrained/Qwen3-VL-8B-Instruct \
#   docker compose -f demo/docker-compose.yml \
#     -f demo/docker-compose.qwen-local.yml up --build agent
services:
  agent:
    environment:
      MARC_SAR_DETECTOR: "qwen"
      MARC_QWEN_BACKEND: "local"
      MARC_QWEN_MODEL_DIR: "/agent/models/runtime/stage1-sar-qwen/model"
    volumes:
      - "${MARC_QWEN_HOST_MODEL_DIR:?Set MARC_QWEN_HOST_MODEL_DIR to the complete Qwen snapshot}:/agent/models/runtime/stage1-sar-qwen/model:ro"
