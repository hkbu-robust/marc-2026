# Hand-reviewed lidar overlay fixtures. XYZ is robot/base frame (REP-103).
# expected_n is after height/range gating and clustering.
cases:
  - id: yaw0_forward
    xyz: [[2.0, 0.0, 0.5]]
    pose: [0.0, 0.0, 0.0]
    expected_n: 1
    expected_world: [2.0, 0.0]
    expected_cells: [[0, 8]]
    res: 0.25
    origin: [0.0, 0.0]
  - id: yaw90_left
    xyz: [[2.0, 0.0, 0.5]]
    pose: [0.0, 0.0, 1.57079632679]
    expected_n: 1
    expected_world: [0.0, 2.0]
    expected_cells: [[8, 0]]
    res: 0.25
    origin: [0.0, 0.0]
  - id: yaw180_back
    xyz: [[2.0, 0.0, 0.5]]
    pose: [0.0, 0.0, 3.14159265359]
    expected_n: 1
    expected_world: [-2.0, 0.0]
    expected_cells: [[0, -8]]
    res: 0.25
    origin: [0.0, 0.0]
  - id: translated_pose
    xyz: [[1.0, 0.0, 0.4]]
    pose: [10.0, 5.0, 0.0]
    expected_n: 1
    expected_world: [11.0, 5.0]
    expected_cells: [[20, 44]]
    res: 0.25
    origin: [0.0, 0.0]
  - id: drop_ground
    xyz: [[1.0, 0.0, -0.5]]
    pose: [0.0, 0.0, 0.0]
    expected_n: 0
  - id: keep_equator
    xyz: [[1.0, 0.0, 0.0]]
    pose: [0.0, 0.0, 0.0]
    expected_n: 1
    expected_world: [1.0, 0.0]
  - id: keep_low
    xyz: [[1.0, 0.0, 0.05]]
    pose: [0.0, 0.0, 0.0]
    expected_n: 1
    expected_world: [1.0, 0.0]
  - id: drop_canopy
    xyz: [[1.5, 0.0, 2.5]]
    pose: [0.0, 0.0, 0.0]
    expected_n: 0
  - id: drop_too_far
    xyz: [[25.0, 0.0, 0.5]]
    pose: [0.0, 0.0, 0.0]
    expected_n: 0
  - id: drop_too_close
    xyz: [[0.02, 0.0, 0.4]]
    pose: [0.0, 0.0, 0.0]
    expected_n: 0
  - id: cluster_same_cell
    xyz: [[2.01, 0.02, 0.4], [1.99, -0.02, 0.5]]
    pose: [0.0, 0.0, 0.0]
    expected_n: 1
    expected_world: [2.0, 0.0]
  - id: two_cells
    xyz: [[2.0, 0.0, 0.4], [4.0, 0.0, 0.5]]
    pose: [0.0, 0.0, 0.0]
    expected_n: 2
  - id: lateral_left
    xyz: [[1.0, 1.0, 0.4]]
    pose: [0.0, 0.0, 0.0]
    expected_n: 1
    expected_world: [1.0, 1.0]
  - id: empty_cloud
    xyz: []
    pose: [0.0, 0.0, 0.0]
    expected_n: 0
  - id: nan_dropped
    xyz: [[NaN, 0.0, 0.4], [1.0, 0.0, 0.4]]
    pose: [0.0, 0.0, 0.0]
    expected_n: 1
    expected_world: [1.0, 0.0]
  - id: mixed_keep_one
    xyz: [[0.02, 0.0, 0.4], [1.2, 0.0, 0.4], [1.2, 0.0, 3.0]]
    pose: [0.0, 0.0, 0.0]
    expected_n: 1
    expected_world: [1.25, 0.0]
