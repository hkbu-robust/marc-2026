  - id: frontal_zero_cmd
    kind: frontal
    res: 0.5
    origin: [0.0, 0.0]
    grid_hw: [20, 40]
    start: [1.0, 5.0, 0.0]
    goal: [16.0, 5.0]
    extra_obstacles: [[1.8, 5.0, 0.4]]
    deadline_s: 1.5
    dt: 0.10
    expect_frontal_zero: true
    expect_status_in: [no_path, timeout, aborted]
