drive_cases:
  - id: corridor_reach
    kind: reach
    res: 0.5
    origin: [0.0, 0.0]
    grid_hw: [20, 40]
    start: [1.0, 5.0, 0.0]
    goal: [8.0, 5.0]
    deadline_s: 40.0
    dt: 0.10
    expect_status: reached
    expect_replan_max: 8
