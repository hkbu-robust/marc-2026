# Hand-reviewed Stage 2 search-area navigation fixtures.
# approach_cases / runtime_steps are geometric. drive_cases use a synthetic unicycle client.

approach_cases:
  - id: far_east_edge
    hint_center: [10.0, 0.0]
    hint_radius: 2.0
    pose: [0.0, 0.0]
    expected: [8.0, 0.0]
  - id: far_north_edge
    hint_center: [0.0, 10.0]
    hint_radius: 3.0
    pose: [0.0, 0.0]
    expected: [0.0, 7.0]
  - id: far_west_edge
    hint_center: [-10.0, 0.0]
    hint_radius: 2.0
    pose: [0.0, 0.0]
    expected: [-8.0, 0.0]
  - id: diagonal_half
    hint_center: [6.0, 8.0]
    hint_radius: 5.0
    pose: [0.0, 0.0]
    expected: [3.0, 4.0]
  - id: already_inside
    hint_center: [0.0, 0.0]
    hint_radius: 5.0
    pose: [1.0, 1.0]
    expected: [1.0, 1.0]
  - id: at_center
    hint_center: [4.0, 4.0]
    hint_radius: 2.0
    pose: [4.0, 4.0]
    expected: [4.0, 4.0]
  - id: zero_radius_uses_center
    hint_center: [5.0, 5.0]
    hint_radius: 0.0
    pose: [0.0, 0.0]
    expected: [5.0, 5.0]
  - id: on_edge_is_inside
    hint_center: [4.0, 0.0]
    hint_radius: 4.0
    pose: [0.0, 0.0]
    expected: [0.0, 0.0]
  - id: offset_not_on_axis
    hint_center: [10.0, 0.0]
    hint_radius: 2.0
    pose: [0.0, 3.0]
    expected: [8.084, 0.575]
  - id: south_from_above
    hint_center: [0.0, 0.0]
    hint_radius: 1.5
    pose: [0.0, 8.0]
    expected: [0.0, 1.5]
  - id: tiny_radius
    hint_center: [3.0, 0.0]
    hint_radius: 0.1
    pose: [0.0, 0.0]
    expected: [2.9, 0.0]
  - id: already_at_goal_center
    hint_center: [0.0, 0.0]
    hint_radius: 0.0
    pose: [0.0, 0.0]
    expected: [0.0, 0.0]

