<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MARC 2026 paper visualization shortlist</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; background:#10141b; color:#edf2f7; }
    body { max-width:1200px; margin:auto; padding:32px 20px 80px; }
    h1 { margin-bottom:8px; } .lede, figcaption { color:#aeb8c7; line-height:1.5; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); gap:24px; }
    figure { margin:0; padding:16px; border:1px solid #303947; border-radius:12px; background:#171d26; }
    img { display:block; width:100%; height:auto; background:white; border-radius:6px; }
    figcaption { margin-top:12px; } code { color:#8bd5ff; }
    .wide { grid-column:1/-1; }
    @media (max-width:520px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <h1>MARC 2026 paper visualization shortlist</h1>
  <p class="lede">Authentic simulation-derived detector evidence, curated from the Stage 1 and Stage 2 readiness reports. These are validation images, not end-to-end competition captures.</p>
  <main class="grid">
    <figure class="wide"><img src="pipeline-overview.svg" alt="Two-stage MARC 2026 pipeline"><figcaption><code>pipeline-overview.svg</code> — compact architecture; dashed means incomplete.</figcaption></figure>
    <figure><img src="stage1-cctv-detections.jpg" alt="Four CCTV frames with YOLO detections"><figcaption><code>stage1-cctv-detections.jpg</code> — best qualitative Stage 1 overview.</figcaption></figure>
    <figure><img src="stage2-nearfield-detections.jpg" alt="Four robot RGB frames with target-conditioned detections"><figcaption><code>stage2-nearfield-detections.jpg</code> — best qualitative Stage 2 overview.</figcaption></figure>
    <figure class="wide"><img src="stage1-detector-comparison.jpg" alt="Raw, previous model, selected model, and ground truth Stage 1 comparison"><figcaption><code>stage1-detector-comparison.jpg</code> — same-frame Stage 1 model evolution.</figcaption></figure>
    <figure class="wide"><img src="stage2-detector-comparison.jpg" alt="Raw, previous model, selected model, low threshold, and ground truth Stage 2 comparison"><figcaption><code>stage2-detector-comparison.jpg</code> — same-frame Stage 2 target-detector comparison.</figcaption></figure>
    <figure><img src="stage1-training-curves.png" alt="Stage 1 detector training curves"><figcaption><code>stage1-training-curves.png</code></figcaption></figure>
    <figure><img src="stage2-training-curves.png" alt="Stage 2 detector training curves"><figcaption><code>stage2-training-curves.png</code></figcaption></figure>
    <figure><img src="stage1-pr-curve.png" alt="Stage 1 detector precision recall curve"><figcaption><code>stage1-pr-curve.png</code></figcaption></figure>
    <figure><img src="stage2-pr-curve.png" alt="Stage 2 detector precision recall curve"><figcaption><code>stage2-pr-curve.png</code></figcaption></figure>
  </main>
</body>
</html>
