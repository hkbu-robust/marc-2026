<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">MARC 2026 two-stage perception and retrieval pipeline</title>
  <desc id="desc">Stage 1 parses a command, detects CCTV candidates, grounds relations or SAR situations, projects pixels to world coordinates, and submits a result. Stage 2 reuses grounding, navigates to the reveal area, detects the target in robot RGB-D, estimates depth, picks and baskets it, then returns it to the owner. The final delivery step is marked pending.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      text { font-family: Liberation Sans, Arial, sans-serif; fill: #172033; }
      .stage { font-size: 28px; font-weight: 700; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
      .vision { fill: #fff7dc; stroke: #d59b19; }
      .geometry { fill: #e8f7ef; stroke: #2c9163; }
      .control { fill: #fff0f0; stroke: #cf5d5d; }
      .pending { fill: #fff7ed; stroke: #ea7c22; stroke-dasharray: 10 7; }
      .label { font-size: 20px; font-weight: 700; text-anchor: middle; }
      .detail { font-size: 16px; fill: #526077; text-anchor: middle; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .reuse { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="620" fill="white"/>
  <text class="stage" x="50" y="70">Stage 1 · Find and localize</text>
  <text class="stage" x="50" y="365">Stage 2 · Retrieve and deliver</text>

  <g>
    <rect class="box" x="50" y="105" width="220" height="105"/>
    <text class="label" x="160" y="145">Command</text><text class="detail" x="160" y="174">target · relation · SAR</text>
    <rect class="box vision" x="320" y="105" width="230" height="105"/>
    <text class="label" x="435" y="145">CCTV YOLO</text><text class="detail" x="435" y="174">all-camera candidates</text>
    <rect class="box" x="600" y="105" width="250" height="105"/>
    <text class="label" x="725" y="145">Grounding</text><text class="detail" x="725" y="174">relation / SAR ranking</text>
    <rect class="box geometry" x="900" y="105" width="250" height="105"/>
    <text class="label" x="1025" y="145">Pixel → world</text><text class="detail" x="1025" y="174">camera K + TF + ground</text>
    <rect class="box" x="1200" y="105" width="300" height="105"/>
    <text class="label" x="1350" y="145">GroundingResult</text><text class="detail" x="1350" y="174">camera + target/anchor XYZ</text>
    <path class="arrow" d="M270 158 H320"/><path class="arrow" d="M550 158 H600"/><path class="arrow" d="M850 158 H900"/><path class="arrow" d="M1150 158 H1200"/>
  </g>

  <g>
    <rect class="box" x="50" y="400" width="220" height="105"/>
    <text class="label" x="160" y="440">Reveal area</text><text class="detail" x="160" y="469">target + hint radius</text>
    <rect class="box control" x="320" y="400" width="220" height="105"/>
    <text class="label" x="430" y="440">Navigate</text><text class="detail" x="430" y="469">map · pose · lidar</text>
    <rect class="box vision" x="590" y="400" width="230" height="105"/>
    <text class="label" x="705" y="440">Robot RGB-D</text><text class="detail" x="705" y="469">target-conditioned YOLO</text>
    <rect class="box geometry" x="870" y="400" width="220" height="105"/>
    <text class="label" x="980" y="440">3-D target</text><text class="detail" x="980" y="469">robust depth + TF</text>
    <rect class="box control" x="1140" y="400" width="200" height="105"/>
    <text class="label" x="1240" y="440">Pick + basket</text><text class="detail" x="1240" y="469">verify and retry</text>
    <rect class="box pending" x="1390" y="400" width="160" height="105"/>
    <text class="label" x="1470" y="435">Return</text><text class="detail" x="1470" y="464">to owner</text><text class="detail" x="1470" y="487">pending</text>
    <path class="arrow" d="M270 453 H320"/><path class="arrow" d="M540 453 H590"/><path class="arrow" d="M820 453 H870"/><path class="arrow" d="M1090 453 H1140"/><path class="arrow" d="M1340 453 H1390"/>
  </g>

  <text x="800" y="292" font-size="18" text-anchor="middle" fill="#7c3aed">Stage 2 begins with a fresh pass through the Stage 1 grounding stack</text>
  <g transform="translate(50 575)"><rect width="22" height="16" class="vision"/><text x="31" y="14" font-size="16">learned vision</text><rect x="180" width="22" height="16" class="geometry"/><text x="211" y="14" font-size="16">geometry</text><rect x="340" width="22" height="16" class="control"/><text x="371" y="14" font-size="16">robot control</text><rect x="510" width="22" height="16" class="pending"/><text x="541" y="14" font-size="16">not yet complete</text></g>
</svg>
